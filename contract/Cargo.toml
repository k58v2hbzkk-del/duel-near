[package]
name = "duel-contract"
version = "1.0.0"
edition = "2021"
description = "DUEL escrow contract: two players lock equal stakes, a referee (AI agent or a friend) settles, winner is paid automatically."
license = "MIT"
repository = "https://github.com/k58v2hbzkk-del/duel-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
