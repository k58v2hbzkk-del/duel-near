name: DUEL referee

# Settles every due duel on testnet. Runs every 10 minutes and on demand.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency: referee

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: referee
        run: npm ci
      - name: Settle due duels
        working-directory: referee
        env:
          DUEL_SEED: ${{ secrets.DUEL_SEED }}
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}
          CLAIM_WINDOW_MINS: "30"
        run: |
          [ -f ../deployments/testnet.json ] || { echo "Not deployed yet: run 'Deploy to NEAR testnet' first"; exit 0; }
          export DUEL_CONTRACT=$(node -p 'require("../deployments/testnet.json").contract')
          export REFEREE_ACCOUNT=$(node -p 'require("../deployments/testnet.json").referee')
          export REFEREE_PRIVATE_KEY=$(node -e 'import("./src/keys.js").then(({deriveKey})=>console.log(deriveKey(process.env.DUEL_SEED,"referee").secretKey))')
          echo "::add-mask::$REFEREE_PRIVATE_KEY"
          node src/run.js
